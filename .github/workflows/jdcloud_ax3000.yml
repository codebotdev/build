name: Build JDCloud AX3000 firmware

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Firmware source branch
        required: true
        default: immortalwrt-v25.12.2

permissions:
  contents: write

concurrency:
  group: jdcloud-ax3000-${{ inputs.source_branch }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SOURCE_BRANCH: ${{ inputs.source_branch }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build project
        uses: actions/checkout@v4

      - name: Prepare runner environment
        run: |
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune --all --force || true
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates subversion help2man xsltproc libelf-dev \
            libtool autoconf automake cmake ninja-build pkgconf zstd
          sudo apt-get clean
          if ! command -v aws >/dev/null 2>&1; then
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update
            rm -rf aws awscliv2.zip
          fi
          sudo mkdir -p /build /upload
          sudo chown -R "$USER:$USER" /build /upload
          ln -sfn /build "$GITHUB_WORKSPACE/build"
          command -v gh
          command -v aws
          aws --version
          df -hT
          free -h

      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.JDCLOUD_AX3000_REPO }}
          ref: ${{ inputs.source_branch }}
          path: build/source
          token: ${{ secrets.JDCLOUD_AX3000_TOKEN }}
          persist-credentials: false

      - name: Build firmware
        run: |
          chmod +x ./scripts/build_jdcloud_ax3000.sh
          ./scripts/build_jdcloud_ax3000.sh

      - name: Upload artifacts
        continue-on-error: true
        env:
          REPO_BUCKET_NAME: ${{ secrets.REPO_BUCKET_NAME || vars.REPO_BUCKET_NAME }}
          REPO_ACCOUNT_ID: ${{ secrets.REPO_ACCOUNT_ID || vars.REPO_ACCOUNT_ID }}
          REPO_ACCESS_KEY_ID: ${{ secrets.REPO_ACCESS_KEY_ID }}
          REPO_SECRET_ACCESS_KEY: ${{ secrets.REPO_SECRET_ACCESS_KEY }}
        run: |
          chmod +x ./scripts/upload_jdcloud_ax3000.sh
          ./scripts/upload_jdcloud_ax3000.sh

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          upload_files=(/upload/*)
          if (( ${#upload_files[@]} == 0 )); then
            echo 'Error: No files found in /upload to upload' >&2
            exit 1
          fi

          echo "Files to upload to Release:"
          ls -lh "${upload_files[@]}"

          branch_tag=$(printf '%s' "$SOURCE_BRANCH" | sed 's/[^A-Za-z0-9._-]/-/g')
          tag="jdcloud_ax3000-${branch_tag}-$(date +%F)"
          source_sha=$(git -C /build/source rev-parse --short HEAD 2>/dev/null || echo "unknown")
          notes="ImmortalWrt JDCloud AX3000 firmware (${SOURCE_BRANCH}@${source_sha}) built on $(date +'%Y-%m-%d %H:%M:%S')"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Uploading files with clobber..."
            gh release upload "$tag" "${upload_files[@]}" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            echo "Creating new release $tag..."
            gh release create "$tag" "${upload_files[@]}" \
              --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          fi
